<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>バックアップ - Knitting Note</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="backup-page">
      <header class="page-header backup-header">
        <button class="back-button" onclick="history.back()">←</button>
        <h1>バックアップ</h1>
      </header>

      <section class="backup-section">
        <div class="backup-card">
          <div class="backup-icon">📤</div>

          <h2>データを書き出す</h2>

          <p>
            作品・毛糸・画像などのデータを<br />
            まとめてバックアップします。
          </p>

          <button type="button" class="submit-button" id="export-button">
            💾 バックアップを保存
          </button>
        </div>

        <div class="backup-card">
          <div class="backup-icon">📥</div>

          <h2>データを復元する</h2>

          <p>
            保存しておいたバックアップファイルから<br />
            データを復元します。
          </p>

          <button type="button" class="image-button" id="import-button">
            📂 バックアップを読み込む
          </button>

          <input
            type="file"
            id="import-input"
            accept=".json,application/json"
            hidden
          />
        </div>
      </section>
      <section class="backup-danger-zone">
        <h2>すべてのデータを削除</h2>
        <p>登録した作品・毛糸のデータをすべて削除します。この操作は取り消せません。</p>
        <button type="button" class="delete-button" id="delete-all-button">全削除</button>
      </section>
    </main>

    <script src="image-store.js"></script>
    <script src="backup.js"></script>
  </body>
</html>
